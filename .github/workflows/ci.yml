# CI 流水线：单元测试 → 前端构建 → 镜像构建（按 git SHA 版本化）
# 推送镜像仓库的步骤按需取消注释（配置 secrets：REGISTRY / REGISTRY_USERNAME / REGISTRY_TOKEN）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 运行单元测试（Mockito 无外部依赖，可直接跑）
        run: mvn -B test
        working-directory: SecKill-backend

  frontend-build:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: seckill-frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: seckill-frontend
      - name: 类型检查 + 构建（vue-tsc + vite build）
        run: npm run build
        working-directory: seckill-frontend

  build-images:
    name: 镜像构建（版本化）
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建全部镜像，tag = git 短 SHA
        run: IMAGE_TAG=$(git rev-parse --short HEAD) docker compose build
      - name: 输出镜像清单
        run: docker images --format '{{.Repository}}:{{.Tag}}' | grep seckill
      # ===== 推送到镜像仓库（需要时取消注释）=====
