server:
  port: 8083

spring:
  application:
    name: seckill-order
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 订单支付超时时间：下单写 expire_time 与延迟队列 TTL 共用这一个值，避免两处配置漂移
order:
  pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health