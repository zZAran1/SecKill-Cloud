spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
    publisher-confirm-type: correlated
    publisher-returns: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
# 支付渠道回调签名密钥（与支付渠道约定，禁止硬编码，通过环境变量注入）
payment:
  secret: ${PAYMENT_SECRET}
jwt:
  public-key: ${JWT_PUBLIC_KEY}
  expiration: ${JWT_EXPIRATION}