spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # 生产同样要给 Prometheus 抓指标（仅容器网络可达，不对外）
        include: health,info,prometheus,metrics

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  expiration: ${JWT_EXPIRATION}
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}