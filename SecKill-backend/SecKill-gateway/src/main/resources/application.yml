server:
  port: 8080  # 网关统一入口

spring:
  application:
    name: seckill-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
    gateway:
      routes:
        # 用户服务路由
        - id: user-service
          uri: lb://seckill-user    # lb = LoadBalancer,从 Nacos 拿实例列表
          predicates:
            - Path=/users/**
        # 商品服务路由
        - id: product-service
          uri: lb://seckill-product
          predicates:
            - Path=/products/**
        # 订单服务路由
        - id: order-service
          uri: lb://seckill-order
          predicates:
            - Path=/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@userKeyResolver}'
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        # 支付服务路由（支付单查询、渠道回调，同属订单服务）
        - id: payment-service
          uri: lb://seckill-order
          predicates:
            - Path=/payments/**
        # 退款服务路由（退款申请、审核，同属订单服务）
        - id: refund-service
          uri: lb://seckill-order
          predicates:
            - Path=/refunds/**
        # 秒杀服务路由（加限流）
        - id: seckill-service
          uri: lb://seckill-order
          predicates:
            - Path=/seckill/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@userKeyResolver}'
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        # 秒杀活动管理路由（预热等,属商品服务）
        - id: seckill-activity-service
          uri: lb://seckill-product
          predicates:
            - Path=/seckill-activities/**
      default-filters:
        # 所有响应统一加响应头,标识经过网关
        - AddResponseHeader=X-Gateway, seckill-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

# JWT 配置:验签用(签发还是在 user 服务)
jwt:
  public-key: ${JWT_PUBLIC_KEY}
  expiration: ${JWT_EXPIRATION}
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

management:
  tracing:
    sampling:
      probability: 1.0   # 链路追踪全采样，保证日志都有 traceId（生产流量大时可调低）
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

# 可观测性：日志输出 [应用名,traceId,spanId]，跨服务串联同一次请求
logging:
  pattern:
    correlation: "[${spring.application.name},%X{traceId:-},%X{spanId:-}] "