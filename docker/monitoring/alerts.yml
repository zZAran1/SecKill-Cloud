# Prometheus 告警规则：服务可用性、错误率、响应延迟、JVM 内存
groups:
  - name: seckill-alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "服务实例下线（{{ $labels.service }} / {{ $labels.instance }}）"
          description: "已 30 秒抓不到指标，服务可能宕机或网络不通。"

      - alert: HttpErrorRateHigh
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "5xx 错误率超过 5%（{{ $labels.service }}）"
          description: "最近 5 分钟服务端错误比例持续偏高，需排查异常日志。"

      - alert: HttpSlowResponse
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 P95 响应时间超过 2 秒（{{ $labels.service }}）"
          description: "响应变慢，检查数据库/缓存/MQ 或下游依赖。"

      - alert: JvmMemoryHigh
        expr: |
          sum by (service) (jvm_memory_used_bytes{area="heap"})
            / sum by (service) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用超过 90%（{{ $labels.service }}）"
          description: "持续高内存可能引发频繁 GC 甚至 OOM。"

      - alert: TooManyRateLimited
        expr: |
          sum by (service) (increase(http_server_requests_seconds_count{status="429"}[5m])) > 100
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "限流触发频繁（{{ $labels.service }}）"
          description: "最近 5 分钟出现大量 429，可能存在刷接口或流量突增。"
