# Prometheus 抓取配置：从容器网络直连各服务的 /actuator/prometheus 指标端点
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'seckill-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: 'seckill-gateway'

  - job_name: 'seckill-user'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user:8081']
        labels:
          service: 'seckill-user'

  - job_name: 'seckill-product'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['product:8082']
        labels:
          service: 'seckill-product'

  - job_name: 'seckill-order'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order:8083']
        labels:
          service: 'seckill-order'
